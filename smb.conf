[global]
    workgroup = WORKGROUP
    server string = Samba Server
    security = user
    map to guest = Bad User
    dns proxy = no

    # 强制使用 SMB3 协议（禁用 SMB1）
    server min protocol = SMB2
    server max protocol = SMB3

    # Socket 优化
    socket options = TCP_NODELAY IPTOS_LOWDELAY

    # 启用 sendfile 零拷贝（减少用户态/内核态拷贝）
    use sendfile = yes

    # 异步 I/O（大文件读写性能提升明显）
    aio read size = 65536
    aio write size = 65536

    # 启用原始读写（批量传输优化）
    read raw = yes
    write raw = yes

    # 最大传输缓冲区
    max xmit = 131072

    # 严格分配模式（提升大文件写入性能）
    strict allocate = yes

    # 禁用不必要的功能减少开销
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # 降低日志级别减少 I/O 开销
    log level = 0

    # 空闲连接超时（秒）
    deadtime = 15

    # 优化大小写处理
    case sensitive = auto
    default case = lower
    preserve case = yes
    short preserve case = yes

[share]
    path = /share_data
    valid users = __USERNAME__
    browsable = yes
    writable = yes
    read only = no
    create mask = 0644
    directory mask = 0755
