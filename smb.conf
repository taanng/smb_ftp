[global]
    workgroup = WORKGROUP
    server string = Samba Server
    security = user
    map to guest = Bad User
    dns proxy = no

    # macOS 兼容：启用 Apple SMB2+ 扩展和 xattr 流支持
    # FinderInfo 等元数据写入 xattr，避免普通文件生成 ._ 伴生文件
    vfs objects = fruit streams_xattr
    fruit:aapl = yes
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:veto_appledouble = no
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:delete_empty_adfiles = yes

    # 禁用 SMB1，最高协议由 Samba 自动协商（支持 SMB3_11 等新方言）
    server min protocol = SMB2

    # 内网可信环境：关闭签名减少 CPU 开销，同时让 min receivefile size 零拷贝写生效
    # 注意：macOS 26.4+ 的 Time Machine 要求 SMB 签名；如需 Time Machine，请改为 auto
    server signing = disabled

    # 读方向零拷贝
    use sendfile = yes

    # 异步 I/O 阈值（16KB 以上走异步，平衡大文件性能与小文件开销）
    aio read size = 16384
    aio write size = 16384

    # 写方向零拷贝阈值（需 signing 未强制时生效）
    min receivefile size = 16384

    # 不强制预分配，保留稀疏文件语义（macOS 磁盘映像/sparsebundle 依赖）
    strict allocate = no

    # 禁用不必要的功能减少开销
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # 降低日志级别减少 I/O 开销
    log level = 0

    # 空闲连接超时（秒）；0 = 不主动断开，避免 macOS Finder 空闲连接被断开
    deadtime = 0

    # 大小写处理
    case sensitive = auto
    default case = lower
    preserve case = yes
    short preserve case = yes

[share]
    path = /share_data
    valid users = __USERNAME__
    browsable = yes
    writable = yes
    read only = no
    create mask = 0644
    directory mask = 0755
