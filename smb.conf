[global]
    workgroup = WORKGROUP
    server string = Samba Server
    security = user
    map to guest = Bad User
    dns proxy = no

    # 禁用 SMB1，最高协议由 Samba 自动协商（支持 SMB3_11 等新方言）
    server min protocol = SMB2

    # 内网可信环境：关闭签名减少 CPU 开销，同时让 min receivefile size 零拷贝写生效
    server signing = disabled

    # 读方向零拷贝
    use sendfile = yes

    # 异步 I/O 阈值（16KB 以上走异步，平衡大文件性能与小文件开销）
    aio read size = 16384
    aio write size = 16384

    # 写方向零拷贝阈值（需 signing 未强制时生效）
    min receivefile size = 16384

    # 预分配（减少大文件写入碎片）
    strict allocate = yes

    # 禁用不必要的功能减少开销
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    # 降低日志级别减少 I/O 开销
    log level = 0

    # 空闲连接超时（秒）
    deadtime = 15

    # 大小写处理
    case sensitive = auto
    default case = lower
    preserve case = yes
    short preserve case = yes

[share]
    path = /share_data
    valid users = __USERNAME__
    browsable = yes
    writable = yes
    read only = no
    create mask = 0644
    directory mask = 0755
