user __USERNAME__;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-webdav/client_body;
    proxy_temp_path /tmp/nginx-webdav/proxy;
    fastcgi_temp_path /tmp/nginx-webdav/fastcgi;
    uwsgi_temp_path /tmp/nginx-webdav/uwsgi;
    scgi_temp_path /tmp/nginx-webdav/scgi;

    dav_ext_lock_zone zone=webdav_locks:1m timeout=30m;

    server {
        listen __WEBDAV_PORT__;
        server_name _;
        root /share_data;

        auth_basic "WebDAV";
        auth_basic_user_file /etc/nginx/webdav.htpasswd;

        client_max_body_size 0;
        client_body_buffer_size 1m;

        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=webdav_locks;
        dav_access user:rw group:rw all:r;
        create_full_put_path on;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        location / {
            # Let the DAV module handle PUT targets before Nginx checks for an existing file.
        }
    }
}
